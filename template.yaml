AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Video Hunter API
  API for Video Hunter

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Architectures:
      - arm64
    Handler: bootstrap
    Runtime: provided.al2023
    Environment:
      Variables:
        VIDEO_TABLE: !Ref VideoTableName
        SETTINGS_TABLE: !Ref SettingsTableName
        LOG_LEVEL: !Ref LogLevel
        REGION: !Ref Region
        ENVIRONMENT: !Ref Environment
        BOT_TOKEN: '{{resolve:ssm:/videohunter/telegram/bot/token:2}}'
        REDDIT_CLIENT_ID: !Ref RedditClientId
        REDDIT_CLIENT_SECRET: !Ref RedditClientSecret
        # The video page handler refuses to start without this variable. The
        # name was mistyped here, so the value it needs was never set; the
        # spelling is corrected rather than left as a second, unread variable.
        DOWNLOAD_HLS_URL: "https://downloadhlsurlgoeshere.com"
        BSKY_USERNAME: '{{resolve:ssm:/videohunter/bsky/username:1}}'
        BSKY_PASSWORD: '{{resolve:ssm:/videohunter/bsky/password:2}}' # It sucks, but it still doesn't support ssm-secure ref apparently. Check later
        GETXAPI_KEY: '{{resolve:ssm:/videohunter/getxapi/key:1}}'
        TWITTER_BOT_USERNAMES: 'BaixadorDeVideo,descargarvid'
        TWITTER_BOT_AUTH_TOKEN_BAIXADORDEVIDEO: '{{resolve:ssm:/videohunter/twitter/baixadordevideo/auth_token:1}}'
        TWITTER_BOT_AUTH_TOKEN_DESCARGARVID: '{{resolve:ssm:/videohunter/twitter/descargarvid/auth_token:1}}'
    Tracing: Active
  Api:
    TracingEnabled: true
    Cors:
      # PATCH, DELETE and the authorization header are here for the account
      # endpoints. The site calls them same origin, so this only matters for a
      # cross origin client such as the local dev server.
      AllowMethods: '''GET,POST,PATCH,DELETE,OPTIONS'''
      AllowHeaders: '''content-type,authorization'''
      AllowOrigin: '''*'''
      AllowCredentials: '''*'''

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - local
    Description: Environment to deploy to.
  Region:
    Type: String
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - eu-central-1
      - sa-east-1
    Description: Region to deploy to
  LogLevel:
    Type: String
    Default: DEBUG
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Log level
  SettingsTableName:
    Type: String
    Default: settings
    Description: Settings table name
  VideoTableName:
    Type: String
    Default: video
    Description: Video table name
  DomainName:
    Type: String
    Default: myvideohunter.com
    Description: Domain name for CloudFront distribution
  BotToken:
    Type: String
    Description: Telegram bot token
  RedditClientId:
    Type: String
    Default: dummy
    Description: Reddit client ID
  RedditClientSecret:
    Type: String
    Default: dummy
    Description: Reddit client secret
  UserDataTableName:
    Type: String
    Default: user_data
    Description: Table that holds each signed in user's folders and saved videos
  ChatDataTableName:
    Type: String
    Default: chat_data
    Description: Table that holds the chat rooms, their messages and connections
  CognitoDomainPrefix:
    Type: String
    Default: videohunter-auth
    Description: |
      Globally unique prefix for the Cognito hosted sign in page. The real URL
      is https://<prefix>.auth.<region>.amazoncognito.com and the front end
      discovers it from /prod/config.
  EnableGoogleLogin:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: |
      Set to true to offer Google sign in. Requires the SSM parameters
      /videohunter/google/client_id and /videohunter/google/client_secret.

Conditions:
  # Google sign in is opt-in so that a deploy never depends on credentials the
  # owner has not created yet.
  CreateGoogleProvider: !Equals [!Ref EnableGoogleLogin, 'true']

Resources:
  GatewayAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  CreateUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/create-url
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url
            Method: POST

  CreateUrlBatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/create-url-batch
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url/batch
            Method: POST

  DownloadHlsVideoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      Runtime: provided.al2
      CodeUri: videohunter-api/functions/download-video-hls
      Layers:
        - !Ref LambdaLayer
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
  
  LambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ffmpeg-lambda-layer
      Description: FFmpeg for AWS Lambda
      ContentUri: build/layer.zip
      CompatibleRuntimes:
        - go1.x
      LicenseInfo: GPL-3.0-or-later
      RetentionPolicy: Retain

  GetUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/get-url
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url/{id}
            Method: GET

  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-telegram
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /telegram-webhook # TODO Can we whitelist the IP address here?
            Method: POST

  # ---------------------------------------------------------------------------
  # Accounts, saved video folders and chat.
  #
  # Everything below is additive. The download path and the video page path do
  # not reference any of it, so nothing here can break them: if the login, the
  # folders or the chat fail, the downloader keeps working exactly as before.
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      # People sign in with their email address. The Cognito "sub" stays the
      # stable identifier, and it is the only one stored in DynamoDB.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Cognito's own sender is fixed at no-reply@verificationemail.com, which
      # reads like phishing on a sign up. The pool sends through SES from the
      # verified domain instead, so the mail a new user gets is from
      # no-reply@myvideohunter.com.
      #
      # The domain identity itself is verified outside this stack: its DKIM
      # records live in the DNS, and CloudFormation has no resource for the
      # identity policy that lets Cognito use it. That policy is applied by
      # hand (see AGENTS.md) and allows email.cognito-idp.amazonaws.com to
      # send through this identity, but only for this pool.
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}
        From: !Sub no-reply@${DomainName}
        # The verified identity carries this configuration set. Cognito
        # refuses the configuration with an internal error while it is left
        # out, which is how this was found.
        ConfigurationSet: my-first-configuration-set
      VerificationMessageTemplate:
        # Kept as a code rather than a link: the hosted UI accepts the code,
        # and a code survives being forwarded or opened on another device.
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Video Hunter verification code
        EmailMessage: |
          Your Video Hunter verification code is {####}

          Enter it on the sign in page to confirm your email address. If you did not try to create an account, you can ignore this message.
      Policies:
        PasswordPolicy:
          # Length only: the rest is friction for an optional account.
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-website
      UserPoolId: !Ref UserPool
      # A browser cannot keep a secret, so this is a public client: the login
      # flow is authorization code with PKCE and no client secret.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders: !If [CreateGoogleProvider, [COGNITO, Google], [COGNITO]]
      CallbackURLs:
        - !Sub https://www.${DomainName}/auth/callback.html
        - http://localhost:5173/auth/callback.html
      LogoutURLs:
        - !Sub https://www.${DomainName}/
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # The prefix has to be globally unique. If a deploy says it is taken,
      # change CognitoDomainPrefix: the front end reads the resulting URL from
      # /prod/config, so nothing else has to change.
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # Google sign in, off by default so that a deploy never depends on
  # credentials the owner has not created yet. To turn it on:
  #   1. create a Google OAuth client with the redirect URI
  #      https://<CognitoDomainPrefix>.auth.<region>.amazoncognito.com/oauth2/idpresponse
  #   2. put the id and secret in SSM: /videohunter/google/client_id and
  #      /videohunter/google/client_secret
  #   3. deploy with EnableGoogleLogin=true (add it to PARAMETERS_OVERRIDE in
  #      the Makefile so make deploy keeps passing it).
  # The SSM values are only read while the provider is enabled.
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: CreateGoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      AttributeMapping:
        email: email
        name: name
      ProviderDetails:
        client_id: '{{resolve:ssm:/videohunter/google/client_id:1}}'
        client_secret: '{{resolve:ssm:/videohunter/google/client_secret:1}}'
        authorize_scopes: 'profile email openid'

  # The folders and saved videos of a signed in user, and the chat block list.
  UserDataFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/user-data
      Environment:
        Variables:
          USER_DATA_TABLE: !Ref UserDataTableName
          # Deletion also clears this user's chat data, so this function needs
          # the chat table as well as its own.
          CHAT_DATA_TABLE: !Ref ChatDataTableName
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_REGION: !Ref Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        # Saving a video checks that its id was resolved before storing it.
        - DynamoDBReadPolicy:
            TableName: !Ref VideoTable
        # Deleting an account also removes the chat data it left behind.
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatDataTable
        # "Delete my account" removes the account itself, last.
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Me:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me
            Method: GET
        DeleteAccount:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me
            Method: DELETE
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me
            Method: PATCH
        ListFolders:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders
            Method: GET
        CreateFolder:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders
            Method: POST
        RenameFolder:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders/{folderId}
            Method: PATCH
        DeleteFolder:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders/{folderId}
            Method: DELETE
        SaveVideo:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders/{folderId}/videos
            Method: POST
        DeleteVideo:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/folders/{folderId}/videos/{videoId}
            Method: DELETE
        ListBlocks:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/blocks
            Method: GET
        BlockUser:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/blocks
            Method: POST
        UnblockUser:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /me/blocks/{blockedUserId}
            Method: DELETE

  # Public browser configuration: where the Cognito login lives and the chat
  # websocket endpoint. Nothing secret, and it keeps the static site free of
  # build time configuration that could drift from the stack.
  ConfigFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/config
      Environment:
        Variables:
          COGNITO_DOMAIN: !Sub ${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          CHAT_WS_ENDPOINT: !Sub wss://${ChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      Events:
        Config:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /config
            Method: GET

  # The chat room attached to a video page. It is its own websocket API, so the
  # REST API that serves the downloads is not touched at all.
  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/chat
      Environment:
        Variables:
          CHAT_DATA_TABLE: !Ref ChatDataTableName
          # The name a room shows comes from the account's profile, which is
          # looked up (and created on first sight) when a socket connects.
          USER_DATA_TABLE: !Ref UserDataTableName
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_REGION: !Ref Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        # Needed to push a message to the other sockets in the room.
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApi}/${Environment}/POST/@connections/*

  ChatWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-chat
      Description: Members only chat rooms attached to video pages
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  ChatWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatFunction.Arn}/invocations

  # Only $connect, $disconnect and $default are routes: the room actions
  # (recent, send, delete, report) arrive as the body of $default messages and
  # are dispatched by the handler.
  ChatConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${ChatWebSocketIntegration}

  ChatDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${ChatWebSocketIntegration}

  ChatDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${ChatWebSocketIntegration}

  ChatWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ChatWebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  ChatFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApi}/*

  VideoTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      TableName: video

  SettingsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: key
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      TableName: settings

  # A signed in user's library. Every row is keyed by the Cognito subject:
  #
  #   pk = <sub>   sk = FOLDER#<id>                   the folder
  #   pk = <sub>   sk = FOLDER#<id>#VIDEO#<video id>  a saved video
  #   pk = <sub>   sk = BLOCK#<blocked user id>       a chat block
  #
  # On demand billing: the traffic is far too low and too spiky for a
  # provisioned capacity to make sense.
  UserDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref UserDataTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Everything the chat needs: open connections, messages, reports and the per
  # user rate limit.
  #
  #   pk = ROOM#<video id>   sk = CONN#<connection id>           a socket
  #   pk = ROOM#<video id>   sk = MSG#<time>#<id>                a message
  #   pk = ROOM#<video id>   sk = REPORT#<msg id>#<user id>      a report
  #   pk = USER#<user id>    sk = RATELIMIT#<window>             rate limit
  #
  # expiresAt is a TTL attribute, so DynamoDB deletes old connections and
  # messages on its own instead of a cleanup job doing it.
  #
  # The byUser index is what makes "delete my account" possible: a room is
  # keyed by video, so without an index on the author a user's messages could
  # not be found across rooms. It is keys only, because deleting a row needs
  # nothing but its key.
  ChatDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ChatDataTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byUser
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Ref DomainName
      HostedZoneTags:
        - Key: Name
          Value: !Ref DomainName

  WebsiteRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub www.${DomainName}
      Type: CNAME
      TTL: '300'
      ResourceRecords:
        - !GetAtt CloudFrontDistribution.DomainName
      # AliasTarget:
      #   DNSName: !GetAtt CloudFrontDistribution.DomainName
      #   HostedZoneId: !Ref HostedZone

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Sub ${DomainName}
          HostedZoneId: !Ref HostedZone
      ValidationMethod: DNS
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - DomainName: !GetAtt WebsiteBucket.DomainName
            Id: !Sub ${AWS::StackName}-s3-origin
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          - DomainName: !Sub ${GatewayAPI}.execute-api.${AWS::Region}.amazonaws.com
            Id: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
          # HLS downloads stream from the DownloadHlsVideoFunction function URL.
          - DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            Id:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            # OAC for the Lambda function URL origin. It lives outside this
            # stack: the Lambda resource policy grants access by distribution
            # ARN. Tracked as follow-up to manage it here.
            OriginAccessControlId: EKJ73Y57EWI6I
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: !Sub ${AWS::StackName}-s3-origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              # CloudFront function that redirects non-www hosts to www. It was
              # created outside this stack; declared here so a stack update does
              # not silently drop the redirect.
              FunctionARN: !Sub arn:aws:cloudfront::${AWS::AccountId}:function/redirect-to-www
        CacheBehaviors:
          - PathPattern: /prod/download
            TargetOriginId:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: a5d1ceca-4d36-43b9-89a8-524f07956fce # CachePolicyUrlQuery (custom, created outside this stack)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          # The account endpoints authenticate with an Authorization header,
          # which the /prod/* behaviour below deliberately does not forward:
          # forwarding it there would either break caching of the video pages
          # or cache a copy per token. These are per-user responses, so they
          # are not cached at all and every viewer header is passed through.
          #
          # Two patterns, because CloudFront's /prod/me/* needs the trailing
          # slash and would not match /prod/me itself.
          - PathPattern: /prod/me
            TargetOriginId: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: /prod/me/*
            TargetOriginId: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: /prod/*
            TargetOriginId: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            ViewerProtocolPolicy: redirect-to-https
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: none
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
        CustomErrorResponses:
          # S3 returns 403 for missing objects when read through an OAC, so map
          # it to the branded 404 page. 404s coming from the API (video not
          # found) are intentionally left alone: they already return a branded
          # page with the downloader form and the ad slots.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        PriceClass: PriceClass_All
        Aliases:
          - !Ref DomainName
          - !Sub '*.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Default Origin Access Control
        Name: !Ref AWS::StackName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 bucket contains static contents
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-website-bucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 bucket policy to allow access from CloudFront OAI
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub ${WebsiteBucket.Arn}/*
              - !GetAtt WebsiteBucket.Arn
            Condition:
              Bool:
                aws:SecureTransport: false

  # Role assumed by GitHub Actions (OIDC, no long-lived keys) in the website
  # repo to publish dist/ to the bucket and invalidate the CDN.
  WebsiteDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-website-deploy
      Description: Assumed by GitHub Actions in victoraldir/video_hunter_website to deploy the static site
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # The deploy job targets the "production" GitHub environment, so
              # the subject is environment based; the ref form is kept for runs
              # that do not use the environment.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:victoraldir/video_hunter_website:environment:production
                  - repo:victoraldir/video_hunter_website:ref:refs/heads/main
      Policies:
        - PolicyName: website-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: WriteSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${WebsiteBucket.Arn}/*
              - Sid: InvalidateCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  ScheduledBotFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      Handler: main
      CodeUri: videohunter-bsky
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      MemorySize: 128
      Timeout: 30
      Events:
        ScheduledEvent:
          Type: 'Schedule'
          Properties:
            Schedule: 'cron(* * * * ? *)' # Every minute
            Name: 'DailyTrigger'
            Description: 'Trigger the bot every minute'

  ScheduledTwitterBotFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      Handler: main
      CodeUri: videohunter-twitter
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      MemorySize: 128
      Timeout: 300
      Events:
        ScheduledEvent:
          Type: 'Schedule'
          Properties:
            Schedule: 'cron(0/10 * * * ? *)' # Every 10 minutes
            Name: 'TwitterBotTrigger'
            Description: 'Fetch mentions and reply to them every 10 minutes'

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
Outputs:
  WebsiteDeployRoleArn:
    Description: IAM role ARN for the website GitHub Actions workflow (AWS_DEPLOY_ROLE_ARN)
    Value: !GetAtt WebsiteDeployRole.Arn
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for the website deploy invalidation (CLOUDFRONT_DISTRIBUTION_ID)
    Value: !Ref CloudFrontDistribution
  VideoHunterAPI:
    Description: API Gateway endpoint URL for Prod stage for Create URL function.
    Value: !Sub https://${GatewayAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/url
  CreateUrlFunction:
    Description: Create URL Lambda Function ARN
    Value: !GetAtt CreateUrlFunction.Arn
  CreateUrlFunctionIamRole:
    Description: Implicit IAM Role created for Create URL function
    Value: !GetAtt CreateUrlFunctionRole.Arn
  HostedZone:
    Description: Hosted zone for Video Hunter
    Value: !Ref HostedZone
  BucketWebsite:
    Description: S3 bucket for Video Hunter website
    Value: !GetAtt WebsiteBucket.WebsiteURL
  UserPoolId:
    Description: Cognito user pool that signs the account tokens
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client the website logs in with
    Value: !Ref UserPoolClient
  CognitoHostedUI:
    Description: Hosted sign in hostname, also published by /prod/config
    Value: !Sub ${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  ChatWebSocketUrl:
    Description: Websocket URL of the chat rooms, also published by /prod/config
    Value: !Sub wss://${ChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
