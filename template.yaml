AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Video Hunter API
  API for Video Hunter

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Architectures:
      - arm64
    Handler: bootstrap
    Runtime: provided.al2023
    Environment:
      Variables:
        VIDEO_TABLE: !Ref VideoTableName
        SETTINGS_TABLE: !Ref SettingsTableName
        LOG_LEVEL: !Ref LogLevel
        REGION: !Ref Region
        ENVIRONMENT: !Ref Environment
        BOT_TOKEN: '{{resolve:ssm:/videohunter/telegram/bot/token:2}}'
        REDDIT_CLIENT_ID: !Ref RedditClientId
        REDDIT_CLIENT_SECRET: !Ref RedditClientSecret
        DONWLOAD_HLS_URL: "https://downloadhlsurlgoeshere.com"
        BSKY_USERNAME: '{{resolve:ssm:/videohunter/bsky/username:1}}'
        BSKY_PASSWORD: '{{resolve:ssm:/videohunter/bsky/password:2}}' # It sucks, but it still doesn't support ssm-secure ref apparently. Check later
        GETXAPI_KEY: '{{resolve:ssm:/videohunter/getxapi/key:1}}'
        TWITTER_BOT_USERNAMES: 'BaixadorDeVideo,descargarvid'
        TWITTER_BOT_AUTH_TOKEN_BAIXADORDEVIDEO: '{{resolve:ssm:/videohunter/twitter/baixadordevideo/auth_token:1}}'
        TWITTER_BOT_AUTH_TOKEN_DESCARGARVID: '{{resolve:ssm:/videohunter/twitter/descargarvid/auth_token:1}}'
    Tracing: Active
  Api:
    TracingEnabled: true
    Cors:
      AllowMethods: '''GET,POST,OPTIONS'''
      AllowHeaders: '''content-type'''
      AllowOrigin: '''*'''
      AllowCredentials: '''*'''

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - local
    Description: Environment to deploy to.
  Region:
    Type: String
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - eu-central-1
      - sa-east-1
    Description: Region to deploy to
  LogLevel:
    Type: String
    Default: DEBUG
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Log level
  SettingsTableName:
    Type: String
    Default: settings
    Description: Settings table name
  VideoTableName:
    Type: String
    Default: video
    Description: Video table name
  DomainName:
    Type: String
    Default: myvideohunter.com
    Description: Domain name for CloudFront distribution
  BotToken:
    Type: String
    Description: Telegram bot token
  RedditClientId:
    Type: String
    Default: dummy
    Description: Reddit client ID
  RedditClientSecret:
    Type: String
    Default: dummy
    Description: Reddit client secret

Resources:
  GatewayAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  CreateUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/create-url
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url
            Method: POST

  CreateUrlBatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/create-url-batch
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url/batch
            Method: POST

  DownloadHlsVideoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      Runtime: provided.al2
      CodeUri: videohunter-api/functions/download-video-hls
      Layers:
        - !Ref LambdaLayer
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
  
  LambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ffmpeg-lambda-layer
      Description: FFmpeg for AWS Lambda
      ContentUri: build/layer.zip
      CompatibleRuntimes:
        - go1.x
      LicenseInfo: GPL-3.0-or-later
      RetentionPolicy: Retain

  GetUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-api/functions/get-url
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VideoTable
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /url/{id}
            Method: GET

  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: videohunter-telegram
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref GatewayAPI
            Path: /telegram-webhook # TODO Can we whitelist the IP address here?
            Method: POST

  VideoTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      TableName: video

  SettingsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: key
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      TableName: settings

  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Ref DomainName
      HostedZoneTags:
        - Key: Name
          Value: !Ref DomainName

  WebsiteRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub www.${DomainName}
      Type: CNAME
      TTL: '300'
      ResourceRecords:
        - !GetAtt CloudFrontDistribution.DomainName
      # AliasTarget:
      #   DNSName: !GetAtt CloudFrontDistribution.DomainName
      #   HostedZoneId: !Ref HostedZone

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Sub ${DomainName}
          HostedZoneId: !Ref HostedZone
      ValidationMethod: DNS
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - DomainName: !GetAtt WebsiteBucket.DomainName
            Id: !Sub ${AWS::StackName}-s3-origin
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          - DomainName: !Sub ${GatewayAPI}.execute-api.${AWS::Region}.amazonaws.com
            Id: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
          # HLS downloads stream from the DownloadHlsVideoFunction function URL.
          - DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            Id:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            # OAC for the Lambda function URL origin. It lives outside this
            # stack: the Lambda resource policy grants access by distribution
            # ARN. Tracked as follow-up to manage it here.
            OriginAccessControlId: EKJ73Y57EWI6I
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: !Sub ${AWS::StackName}-s3-origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              # CloudFront function that redirects non-www hosts to www. It was
              # created outside this stack; declared here so a stack update does
              # not silently drop the redirect.
              FunctionARN: !Sub arn:aws:cloudfront::${AWS::AccountId}:function/redirect-to-www
        CacheBehaviors:
          - PathPattern: /prod/download
            TargetOriginId:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt: [DownloadHlsVideoFunctionUrl, FunctionUrl]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: a5d1ceca-4d36-43b9-89a8-524f07956fce # CachePolicyUrlQuery (custom, created outside this stack)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          - PathPattern: /prod/*
            TargetOriginId: !Sub ${AWS::StackName}-api-videohunter-gtw-origin
            ViewerProtocolPolicy: redirect-to-https
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: none
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
        CustomErrorResponses:
          # S3 returns 403 for missing objects when read through an OAC, so map
          # it to the branded 404 page. 404s coming from the API (video not
          # found) are intentionally left alone: they already return a branded
          # page with the downloader form and the ad slots.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        PriceClass: PriceClass_All
        Aliases:
          - !Ref DomainName
          - !Sub '*.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Default Origin Access Control
        Name: !Ref AWS::StackName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 bucket contains static contents
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-website-bucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 bucket policy to allow access from CloudFront OAI
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub ${WebsiteBucket.Arn}/*
              - !GetAtt WebsiteBucket.Arn
            Condition:
              Bool:
                aws:SecureTransport: false

  # Role assumed by GitHub Actions (OIDC, no long-lived keys) in the website
  # repo to publish dist/ to the bucket and invalidate the CDN.
  WebsiteDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-website-deploy
      Description: Assumed by GitHub Actions in victoraldir/video_hunter_website to deploy the static site
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # The deploy job targets the "production" GitHub environment, so
              # the subject is environment based; the ref form is kept for runs
              # that do not use the environment.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:victoraldir/video_hunter_website:environment:production
                  - repo:victoraldir/video_hunter_website:ref:refs/heads/main
      Policies:
        - PolicyName: website-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: WriteSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${WebsiteBucket.Arn}/*
              - Sid: InvalidateCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  ScheduledBotFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      Handler: main
      CodeUri: videohunter-bsky
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      MemorySize: 128
      Timeout: 30
      Events:
        ScheduledEvent:
          Type: 'Schedule'
          Properties:
            Schedule: 'cron(* * * * ? *)' # Every minute
            Name: 'DailyTrigger'
            Description: 'Trigger the bot every minute'

  ScheduledTwitterBotFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      Handler: main
      CodeUri: videohunter-twitter
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      MemorySize: 128
      Timeout: 300
      Events:
        ScheduledEvent:
          Type: 'Schedule'
          Properties:
            Schedule: 'cron(0/10 * * * ? *)' # Every 10 minutes
            Name: 'TwitterBotTrigger'
            Description: 'Fetch mentions and reply to them every 10 minutes'

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
Outputs:
  WebsiteDeployRoleArn:
    Description: IAM role ARN for the website GitHub Actions workflow (AWS_DEPLOY_ROLE_ARN)
    Value: !GetAtt WebsiteDeployRole.Arn
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for the website deploy invalidation (CLOUDFRONT_DISTRIBUTION_ID)
    Value: !Ref CloudFrontDistribution
  VideoHunterAPI:
    Description: API Gateway endpoint URL for Prod stage for Create URL function.
    Value: !Sub https://${GatewayAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/url
  CreateUrlFunction:
    Description: Create URL Lambda Function ARN
    Value: !GetAtt CreateUrlFunction.Arn
  CreateUrlFunctionIamRole:
    Description: Implicit IAM Role created for Create URL function
    Value: !GetAtt CreateUrlFunctionRole.Arn
  HostedZone:
    Description: Hosted zone for Video Hunter
    Value: !Ref HostedZone
  BucketWebsite:
    Description: S3 bucket for Video Hunter website
    Value: !GetAtt WebsiteBucket.WebsiteURL
