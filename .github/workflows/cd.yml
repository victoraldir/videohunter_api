name: CD
on:
  push:
    # paths:
    #   - videohunter-api/**
    #   - videohunter-bot/**
    #   - samconfig.toml
    #   - template.yaml
    #   - Makefile
    branches: [ main ]

# Two pushes to main in quick succession would otherwise start two deployments at
# once. CloudFormation accepts only one operation per stack, so the second deploy
# fails with UPDATE_IN_PROGRESS and the run goes red for no real reason. Queueing
# serialises them.
#
# cancel-in-progress stays false deliberately: this job drives a CloudFormation
# update, and cancelling the run does not cancel that update. Letting a deploy
# finish and the next one wait behind it is the safer order.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.23"
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
    
      # - name: Test
      #   run: |
      #     make test
      
      - name: Deploy
        run : | 
          make deploy
        env:
            AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
            AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            AWS_DEFAULT_REGION: "${{ secrets.AWS_DEFAULT_REGION }}"
